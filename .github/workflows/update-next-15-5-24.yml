name: Update Next.js to 15.5.24

on:
  push:
    paths:
      - '.github/workflows/update-next-15-5-24.yml'

permissions:
  contents: write

jobs:
  update-next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Update Next.js and lockfile
        run: pnpm add next@15.5.24 --save-exact

      - name: Verify production build
        run: pnpm run build

      - name: Commit dependency update and remove temporary workflow
        run: |
          rm -f .github/workflows/update-next-15-5-24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/update-next-15-5-24.yml
          git commit -m "chore: update Next.js to 15.5.24"
          git push
